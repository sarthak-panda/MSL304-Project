name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: C++ engine (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: AddressSanitizer + UBSan
            flags: -DCMAKE_BUILD_TYPE=Debug -DFLOWSIM_SANITIZE=address,undefined
          - name: ThreadSanitizer
            flags: -DCMAKE_BUILD_TYPE=Debug -DFLOWSIM_SANITIZE=thread
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nlohmann-json3-dev
      - name: Allow TSan on the runner kernel
        if: matrix.name == 'ThreadSanitizer'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --parallel
      - name: Unit and CLI tests
        run: ctest --test-dir build --output-on-failure

  integration:
    name: Python and UI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nlohmann-json3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ui/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build engine
        run: ./scripts/build.sh Release
      - name: Install Python dependencies
        run: pip install -r ui/requirements.txt
      - name: Check live demo script
        run: node --check ui/live_demo/frontend/demo.js
      - name: pytest (engine client, CLI, every Streamlit page, Pages build)
        run: python -m pytest -v tests/python
      - name: Build the Pages site
        run: python scripts/build_pages.py --out site
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: site
          retention-days: 7
